<body class="bg-white text-gray-800">
  <!-- Header -->
  <header class="bg-green-700 text-white py-4 shadow-lg fixed w-full z-20">
    <nav class="flex justify-between items-center max-w-7xl mx-auto px-6">
      <!-- Logo and Title -->
      <div class="flex items-center gap-3">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRO4jeyrtApRw6SIX9WR5342CsRMDX4ZiMRLg&s" alt="ALCU Logo" class="h-12 w-12 rounded-full" />
        <h1 class="text-3xl font-extrabold tracking-tight">ALCU 2025</h1>
      </div>
      
      <!-- Desktop Navigation Links -->
      <ul class="hidden md:flex gap-8 text-lg">
        <li><a href="index.html" class="nav-link" id="home-link">Home</a></li>
        <li><a href="about.html" class="nav-link" id="about-link">About</a></li>
        <li><a href="gallery.html" class="nav-link" id="gallery-link">Gallery</a></li>
      </ul>
      
      <!-- Mobile Menu Button -->
      <div class="md:hidden">
        <button id="mobile-menu-button" class="text-white hover:text-green-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden bg-green-700 text-white md:hidden">
      <ul class="flex flex-col items-center p-4 space-y-4">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="gallery.html" class="nav-link">Gallery</a></li>
      </ul>
    </div>
  </header>

  <script>
    // Set active link on page load (can be dynamic with backend rendering)
    document.addEventListener('DOMContentLoaded', function() {
      const links = document.querySelectorAll('.nav-link');
      const currentPage = window.location.pathname.split('/').pop(); // Get current page from URL

      links.forEach(link => {
        if (link.getAttribute('href').includes(currentPage)) {
          link.classList.add('underline', 'font-semibold'); // Underline active link
        }
      });

      // Mobile menu toggle
      document.getElementById('mobile-menu-button').addEventListener('click', () => {
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenu.classList.toggle('hidden');
      });
    });
  </script>
  
  <style>
    /* Active Link Styling */
    .nav-link {
      transition: all 0.3s ease-in-out;
    }

    .nav-link:hover,
    .nav-link:focus,
    .nav-link.underline {
      text-decoration: underline;
      font-weight: 700;
    }
  </style>
</body>
</html>

      <p class="text-xl lg:text-2xl text-white mb-8 drop-shadow-md">Reliving the vibrant spirit of student unity and excellence.</p>

        View Gallery

</main>
